name: Check autoload editor
on:
  pull_request:
    paths:
      - 'slopkit/**'
      - '.github/scripts/check_autoload_editor.cjs'
      - '.github/scripts/check_autoload_ftp.cjs'
      - '.github/scripts/check_autoload_bridge.cjs'
      - 'autoload-helper/**'
      - 'index.html'
      - '.github/workflows/check-autoload-editor.yml'
  push:
    branches: [main]
    paths:
      - 'slopkit/autoload-*.js'
      - 'slopkit/poops.html'
      - '.github/scripts/check_autoload_editor.cjs'
      - '.github/scripts/check_autoload_ftp.cjs'
      - '.github/scripts/check_autoload_bridge.cjs'
      - 'autoload-helper/**'
      - 'index.html'
      - '.github/workflows/check-autoload-editor.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cc -DAUTOLOAD_HOST_TEST -Wall -Wextra -Werror -o /tmp/autoload-helper-test autoload-helper/bridge.c
          node --check slopkit/autoload-bridge.js
          node .github/scripts/check_autoload_bridge.cjs /tmp/autoload-helper-test
          node --check slopkit/autoload-core.js
          node --check slopkit/autoload-ps5.js
          node --check slopkit/autoload-ui.js
          node --check slopkit/autoload-ftp.js
          node .github/scripts/check_autoload_ftp.cjs
          node .github/scripts/check_autoload_editor.cjs
          node --check /tmp/slopkit-autoload-module.mjs
