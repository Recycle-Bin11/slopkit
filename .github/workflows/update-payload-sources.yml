name: Update payload sources

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Payload to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - ftpsrv
          - shadowmountplus
          - kstuff
      channel:
        description: pinned = listed versions; latest = upstream latest release
        required: true
        default: pinned
        type: choice
        options:
          - pinned
          - latest

permissions:
  actions: write
  contents: write

concurrency:
  group: update-payload-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and validate payloads
        run: >-
          python3 .github/scripts/update_payload_sources.py
          --payload "${{ inputs.payload }}"
          --channel "${{ inputs.channel }}"

      - name: Commit payload changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- payloads/ftpsrv-ps5.elf payloads/kstuff.elf payloads/shadowmountplus.elf
          if git diff --cached --quiet; then
            echo "Selected payloads are already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update payload sources (${{ inputs.payload }}, ${{ inputs.channel }})"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild payload updater
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-payload-updater.yml --ref main
