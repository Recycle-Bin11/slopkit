name: Build Web Browser shortcut installer

on:
  push:
    branches:
      - agent/add-payload-manager
    paths:
      - "shortcut-installer/**"
      - ".github/workflows/build-shortcut-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make python3 unzip wget
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install PS5 Payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q ps5-payload-sdk.zip -d /opt

      - name: Build installer ELF
        run: make -C shortcut-installer clean all

      - name: Validate ELF
        run: |
          test -s shortcut-installer/web-browser-installer.elf
          python3 - <<'PY'
          from pathlib import Path
          elf = Path("shortcut-installer/web-browser-installer.elf").read_bytes()
          if not elf.startswith(b"\x7fELF"):
              raise SystemExit("build output is not an ELF")
          print(f"validated ELF: {len(elf)} bytes")
          PY

      - name: Publish ELF to branch
        run: |
          mkdir -p payloads
          cp shortcut-installer/web-browser-installer.elf payloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads/web-browser-installer.elf
          if git diff --cached --quiet; then
            echo "ELF is already current"
          else
            git commit -m "Build Web Browser shortcut installer ELF"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-browser-installer
          path: shortcut-installer/web-browser-installer.elf
